<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workout Tracker</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/glass.css">
  <script>
    // v3.0.0: Erscheinung vor dem ersten Zeichnen setzen (Dunkel ist Standard; js/theme.js übernimmt danach)
    try {
      var s = JSON.parse(localStorage.getItem('wt_settings') || '{}');
      if (s && s.appearance === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F2F2F7');
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
      }
    } catch (e) { /* ohne Speicher: Dunkel */ }
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div id="savebar" class="savebar" role="alert" hidden>Nicht gespeichert – Speicher voll? <a href="#/settings">Backup exportieren</a></div>
  <main id="view" class="view" tabindex="-1"></main>
  <nav id="tabbar" class="tabbar" aria-label="Hauptnavigation"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;color:#fff">Diese App benötigt JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
