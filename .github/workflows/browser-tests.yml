# Browser-Tests in WebKit (Safari-Engine) und Chromium (Android-Profile) für wip-Branches.
# Ergebnis: Artefakt „browser-tests“ und ein Commit auf dem Branch ci-results (Bericht + Screenshots),
# damit die Ergebnisse auch ohne GitHub-Login per git gelesen werden können. Keine persönlichen Daten.
name: browser-tests
on:
  push:
    branches: ['wip/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright installieren
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps webkit chromium
      - name: Node-Tests
        run: npm test
      - name: Beta-Durchlauf WebKit (iPhone SE, iPhone 15)
        continue-on-error: true
        run: WT_REPORT=out/beta-webkit.json node tests/browser/beta.mjs --engine webkit --devices "iPhone SE,iPhone 15" --old 85e3ac7 --shots out/shots 2>&1 | tee out-beta-webkit.txt
      - name: Beta-Durchlauf Chromium (Pixel 7, Galaxy S24)
        continue-on-error: true
        run: WT_REPORT=out/beta-chromium.json node tests/browser/beta.mjs --engine chromium --devices "Pixel 7,Galaxy S24" --old 85e3ac7 2>&1 | tee out-beta-chromium.txt
      - name: Bestehende Prüfungen in WebKit
        continue-on-error: true
        run: |
          mkdir -p out
          for f in tests/browser/check-*.mjs; do
            n=$(basename "$f" .mjs); [ "$n" = check-anim ] && continue
            echo "### $n" >> out/checks-webkit.txt
            WT_ENGINE=webkit timeout 300 node "$f" >> out/checks-webkit.txt 2>&1 || echo "EXIT $? $n" >> out/checks-webkit.txt
          done
      - name: Ergebnisse sammeln
        if: always()
        run: |
          mkdir -p out
          cp out-beta-*.txt out/ 2>/dev/null || true
          echo "commit ${GITHUB_SHA} branch ${GITHUB_REF_NAME} $(date -u +%FT%TZ)" > out/RUN.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-tests
          path: out
      - name: Ergebnis-Branch ci-results aktualisieren
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          rm -rf /tmp/res && cp -r out /tmp/res
          git fetch origin ci-results || true
          if git rev-parse --verify origin/ci-results >/dev/null 2>&1; then git checkout -B ci-results origin/ci-results; else git checkout --orphan ci-results; git rm -rf . >/dev/null; fi
          rm -rf "runs/${GITHUB_REF_NAME//\//_}" && mkdir -p "runs/${GITHUB_REF_NAME//\//_}"
          cp -r /tmp/res/. "runs/${GITHUB_REF_NAME//\//_}/"
          git add runs && git commit -m "CI-Ergebnis ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" && git push origin ci-results
